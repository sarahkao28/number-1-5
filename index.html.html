<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數字形狀與數量卡通互動板</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    
    body {
      margin: 0; padding: 0;
      background-color: #FFED99;
      background-image: radial-gradient(#F5C16C 15%, transparent 15%);
      background-size: 25px 25px;
      font-family: 'Comic Sans MS', system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      height: 100vh; overflow: hidden;
    }
    
    #nav-bar {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      background: #FFFFFF; border-bottom: 8px solid #333333;
      padding: 10px 20px; height: 12vh; z-index: 10;
    }
    
    .nav-btn {
      background: #F48FB1; color: white; border: 5px solid #333333;
      font-size: 1.4rem; padding: 8px 20px; border-radius: 25px;
      font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 0 #333333; transition: transform 0.1s;
    }
    .nav-btn:active { transform: translateY(6px); box-shadow: none; }
    
    #page-indicator {
      font-size: 2.5rem; font-weight: 900; color: #333;
    }

    .mode-switch {
      display: flex; gap: 10px;
    }
    .mode-btn {
      font-size: 1.2rem; padding: 8px 15px; border-radius: 20px;
      border: 5px solid #333333; font-weight: 900; cursor: pointer;
      transition: all 0.2s;
    }
    #mode-auto { background: #2196F3; color: white; box-shadow: 0 6px 0 #333333; }
    #mode-manual { background: #E0E0E0; color: #757575; box-shadow: 0 6px 0 #333333; }
    
    .mode-btn.active { box-shadow: 0 6px 0 #333333; opacity: 1; transform: translateY(0); }
    .mode-btn:not(.active) { opacity: 0.6; box-shadow: none; transform: translateY(6px); }

    #top-section {
      display: flex; width: 100%; max-width: 900px; 
      justify-content: space-around; align-items: center; 
      padding: 15px; height: 53vh; gap: 15px;
    }
    
    .interact-box {
      flex: 1; height: 100%; 
      border: 8px solid #333333; border-radius: 25px;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 10px 0 #333333; cursor: pointer;
      position: relative;
    }
    .interact-box:active { transform: translateY(6px); box-shadow: 0 4px 0 #333333; }
    
    #box-img { background: #64B5F6; } 
    #box-stroke { background: #FFF9C4; } 
    
    #shape-img {
      max-width: 80%; max-height: 80%; object-fit: contain;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #emoji-fallback {
      font-size: 8rem; display: none; transition: transform 0.3s;
    }
    .jump { transform: scale(1.15) translateY(-20px); }

    #svg-container { width: 100%; height: 100%; }

    #quantity-section {
      width: 95%; max-width: 870px; height: 28vh;
      background: #4DB6AC; 
      border: 8px solid #333333; border-radius: 25px;
      display: flex; gap: 20px; flex-wrap: wrap; 
      justify-content: center; align-items: center; padding: 15px;
      box-shadow: 0 10px 0 #333333;
      position: relative; margin-top: 10px;
    }
    #quantity-section.clickable:active { transform: translateY(6px); box-shadow: 0 4px 0 #333333; }
    
    .box-label {
      position: absolute; top: 12px; left: 12px;
      background: white; border: 4px solid #333333; border-radius: 12px;
      padding: 4px 12px; font-weight: 900; font-size: 1.1rem; color: #333333;
      pointer-events: none;
    }

    .hole {
      width: 11vw; height: 11vw; max-width: 70px; max-height: 70px;
      background: transparent; border: 6px dashed #333333; border-radius: 50%;
      transition: all 0.2s; pointer-events: auto; 
      cursor: pointer;
    }
    .filled {
      background: #FF5252; 
      border: 6px solid #333333;
      transform: scale(1.15);
    }

    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: none; background: rgba(255,255,255,0);
    }
  </style>
</head>
<body>

  <div id="overlay"></div>

  <div id="nav-bar">
    <button class="nav-btn" onclick="changePage(-1)">◀ 上一個</button>
    <div id="page-indicator">1</div>
    <div class="mode-switch">
      <button id="mode-auto" class="mode-btn active" onclick="setMode('auto')">自動播放模式</button>
      <button id="mode-manual" class="mode-btn" onclick="setMode('manual')">自己動手做</button>
    </div>
    <button class="nav-btn" onclick="changePage(1)">下一個 ▶</button>
  </div>

  <div id="top-section">
    <div class="interact-box" id="box-img" onclick="playImage()">
      <img id="shape-img" src="1.png" alt="形狀圖" onerror="showEmoji()">
      <div id="emoji-fallback">✏️</div>
    </div>
    
    <div class="interact-box" id="box-stroke" onclick="playStroke()">
      <div class="box-label">點一下播放</div>
      <svg id="svg-container" viewBox="0 0 200 250">
        <g id="bg-paths" stroke="#E0E0E0" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" fill="none"></g>
        <g id="anim-paths" stroke="#FF5252" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" fill="none"></g>
      </svg>
    </div>
  </div>

  <div id="quantity-section" onclick="playPegs(event)">
    <div class="box-label">看木樁長大</div>
  </div>

  <script>
    const pages = [
      { num: 1, img: '1.png', emoji: '✏️', dots: 1, voice: '鉛筆一', shortVoice: '一', paths: ['M 100 40 L 100 220'], color: '#FF5252' },
      { num: 2, img: '2.png', emoji: '🦆', dots: 2, voice: '鴨子二', shortVoice: '二', paths: ['M 40 80 C 40 10, 160 10, 160 80 C 160 150, 40 220, 40 220 L 160 220'], color: '#FF9800' },
      { num: 3, img: '3.png', emoji: '🦋', dots: 3, voice: '蝴蝶三', shortVoice: '三', paths: ['M 50 70 C 150 20, 160 110, 90 125', 'M 90 125 C 180 125, 170 230, 40 210'], color: '#FFEB3B' },
      { num: 4, img: '4.png', emoji: '⛵', dots: 4, voice: '帆船四', shortVoice: '四', paths: ['M 140 30 L 40 160 L 180 160', 'M 140 80 L 140 220'], color: '#4CAF50' },
      { num: 5, img: '5.png', emoji: '🪝', dots: 5, voice: '鉤子五', shortVoice: '五', paths: ['M 60 40 L 160 40', 'M 60 40 L 60 110', 'M 60 110 C 180 90, 190 220, 50 210'], color: '#9C27B0' }
    ];

    let currentIndex = 0;
    let currentMode = 'auto'; 
    let manualStrokeIndex = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function showEmoji() {
      document.getElementById('shape-img').style.display = 'none';
      document.getElementById('emoji-fallback').style.display = 'block';
    }

    function playSound(freq, type, duration) {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-auto').classList.toggle('active', mode === 'auto');
      document.getElementById('mode-manual').classList.toggle('active', mode === 'manual');
      
      const qSec = document.getElementById('quantity-section');
      if (mode === 'auto') {
        qSec.classList.add('clickable');
      } else {
        qSec.classList.remove('clickable'); 
      }
      initPage(); 
    }

    function changePage(dir) {
      currentIndex = (currentIndex + dir + pages.length) % pages.length;
      initPage();
    }

    function initPage() {
      const data = pages[currentIndex];
      manualStrokeIndex = 0;
      
      document.getElementById('page-indicator').innerText = data.num;

      const img = document.getElementById('shape-img');
      const emoji = document.getElementById('emoji-fallback');
      img.src = data.img;
      img.style.display = 'block';
      emoji.style.display = 'none';
      emoji.innerText = data.emoji;
      
      img.classList.remove('jump');
      emoji.classList.remove('jump');

      const qSec = document.getElementById('quantity-section');
      const labelHtml = '<div class="box-label">看木樁長大</div>';
      qSec.innerHTML = labelHtml;
      
      for(let i = 0; i < data.dots; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.id = `hole-${i}`;
        qSec.appendChild(hole);
      }

      const bgGroup = document.getElementById('bg-paths');
      const animGroup = document.getElementById('anim-paths');
      bgGroup.innerHTML = ''; animGroup.innerHTML = '';

      data.paths.forEach((p, index) => {
        const bgPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        bgPath.setAttribute("d", p);
        bgGroup.appendChild(bgPath);

        const animPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        animPath.setAttribute("d", p);
        animPath.id = `stroke-${index}`;
        
        const len = 1000; 
        animPath.style.strokeDasharray = len;
        animPath.style.strokeDashoffset = len;
        animGroup.appendChild(animPath);
      });
    }

    function playImage() {
      const data = pages[currentIndex];
      const img = document.getElementById('shape-img');
      const emoji = document.getElementById('emoji-fallback');
      playSound(300, 'square', 0.1);
      
      if(img.style.display !== 'none') img.classList.add('jump');
      else emoji.classList.add('jump');
      
      setTimeout(() => {
        img.classList.remove('jump');
        emoji.classList.remove('jump');
        speakText(data.voice); 
      }, 400);
    }

    function playStroke() {
      const data = pages[currentIndex];
      const overlay = document.getElementById('overlay');
      
      if (currentMode === 'auto') {
        overlay.style.display = 'block'; 
        data.paths.forEach((_, i) => {
          const path = document.getElementById(`stroke-${i}`);
          path.style.transition = 'none';
          path.style.strokeDashoffset = 1000;
        });
        
        let delay = 50;
        data.paths.forEach((_, i) => {
          setTimeout(() => {
            playSound(500 + i*100, 'triangle', 0.5);
            const path = document.getElementById(`stroke-${i}`);
            path.style.transition = 'stroke-dashoffset 0.8s ease-out';
            path.style.strokeDashoffset = 0;
          }, delay);
          delay += 900;
        });

        setTimeout(() => {
          speakText(data.shortVoice); 
          overlay.style.display = 'none';
        }, delay);

      } else {
        if (manualStrokeIndex < data.paths.length) {
          playSound(500 + manualStrokeIndex*100, 'triangle', 0.5);
          const path = document.getElementById(`stroke-${manualStrokeIndex}`);
          path.style.transition = 'stroke-dashoffset 0.8s ease-out';
          path.style.strokeDashoffset = 0;
          manualStrokeIndex++;
          
          if (manualStrokeIndex === data.paths.length) {
            setTimeout(() => speakText(data.shortVoice), 800); 
          }
        } else {
          initPage(); 
        }
      }
    }

    function playPegs(event) {
      const data = pages[currentIndex];
      const overlay = document.getElementById('overlay');

      if (currentMode === 'auto') {
        overlay.style.display = 'block';
        for(let i=0; i<data.dots; i++) {
          document.getElementById(`hole-${i}`).classList.remove('filled');
        }

        let dotDelay = 50;
        for(let i=0; i<data.dots; i++) {
          setTimeout(() => {
            playSound(600 + (i*50), 'sine', 0.2);
            const hole = document.getElementById(`hole-${i}`);
            hole.classList.add('filled');
            hole.style.backgroundColor = data.color; 
          }, dotDelay);
          dotDelay += 400;
        }

        setTimeout(() => {
          speakText(data.shortVoice); 
          overlay.style.display = 'none';
        }, dotDelay + 200);

      } else {
        const clickedHole = event.target.closest('.hole');
        const filledCountNow = document.querySelectorAll('#quantity-section .filled').length;

        if (clickedHole) {
          if (!clickedHole.classList.contains('filled')) {
            playSound(600 + (filledCountNow * 50), 'sine', 0.2);
            clickedHole.classList.add('filled');
            clickedHole.style.backgroundColor = data.color;
            
            if (filledCountNow + 1 === data.dots) {
              setTimeout(() => speakText(data.shortVoice), 300); 
            }
          }
        } else {
          if (filledCountNow === data.dots) {
            initPage();
          }
        }
      }
    }

    window.onload = () => setMode('auto');
  </script>
</body>
</html>
